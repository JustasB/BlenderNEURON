# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/configuration-reference

# For a detailed guide to building and testing with Python, read the docs:
# https://circleci.com/docs/language-python/ for more details
version: 2.1

# Orbs are reusable packages of CircleCI configuration that you may share across projects, enabling you to create encapsulated, parameterized commands, jobs, and executors that can be used across multiple projects.
# See: https://circleci.com/docs/orb-intro/
orbs:
  # See the Python orb documentation here: https://circleci.com/developer/orbs/orb/circleci/python
  python: circleci/python@2.1.1
  codecov: codecov/codecov@4.1.0

# Define a job to be invoked later in a workflow.
# See: https://circleci.com/docs/jobs-steps/#jobs-overview & https://circleci.com/docs/configuration-reference/#jobs
jobs:
  windows-connections:
    machine:
      image: windows-server-2022-gui:current
    resource_class: windows.medium
    steps:
      - checkout
      - run:
          name: Standard-library connection security tests
          command: python tests/test_connection_security.py
          shell: powershell.exe -ExecutionPolicy Bypass
  docker-tutorial:
    # A VM provides a local Docker daemon, so repository/output bind mounts work.
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Build the repository Docker image
          command: ./scripts/build.sh
      - run:
          name: Render the headless tutorial inside Docker
          command: |
            mkdir -p "$PWD/tutorials/02-docker-script/output"
            docker run --rm --init \
              -v "$PWD:/BlenderNEURON:ro" \
              -v "$PWD/tutorials/02-docker-script/output:/output" \
              -w /BlenderNEURON blenderneuron:latest \
              python -u tutorials/02-docker-script/run.py \
              --width 320 --height 240 --frames 60 --samples 4 --fps 20 --timeout 600
      - run:
          name: Make tutorial artifacts readable
          when: always
          command: |
            # The container writes as root, including private run directories.
            # Let CircleCI collect the results and failure logs as its normal user.
            if [ -d tutorials/02-docker-script/output ]; then
              sudo chown -R "$(id -u):$(id -g)" tutorials/02-docker-script/output
            fi
      - store_artifacts:
          path: tutorials/02-docker-script/output
          destination: headless-tutorial
  compatibility:
    parameters:
      lane:
        type: enum
        enum: [baseline, python2, neuron7, neuron9, blender2, blender4]
    # Native x86-64 VM: official wheels/Blender archives, local Docker mounts.
    machine:
      image: ubuntu-2404:current
      docker_layer_caching: true
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Full compatibility suite — << parameters.lane >>
          # The runner separately bounds image setup (30m) and the suite (10m).
          no_output_timeout: 35m
          command: python3 scripts/test-compatibility.py << parameters.lane >>
      - run:
          name: Make compatibility reports readable
          when: always
          command: |
            if [ -d .compatibility-results ]; then
              sudo chown -R "$(id -u):$(id -g)" .compatibility-results
            fi
      - store_artifacts:
          path: .compatibility-results/<< parameters.lane >>
          destination: compatibility/<< parameters.lane >>
      - when:
          condition:
            equal: [baseline, << parameters.lane >>]
          steps:
            - codecov/upload:
                file: .compatibility-results/baseline/coverage.xml

# Orchestrate jobs using workflows
# See: https://circleci.com/docs/workflows/ & https://circleci.com/docs/configuration-reference/#workflows
workflows:
  sample: # This is the name of the workflow, feel free to change it to better match your workflow.
    # Inside the workflow, you define the jobs you want to run.
    jobs:
      - compatibility:
          name: compatibility-<< matrix.lane >>
          matrix:
            parameters:
              lane: [baseline, python2, neuron7, neuron9, blender2, blender4]
      - docker-tutorial
      - windows-connections
